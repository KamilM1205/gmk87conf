name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-format:
    name: Check code formatting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path:
          - 'src'
          - 'tests'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Check formatting
        uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: '22'
          check-path: ${{ matrix.path }}

  build-and-test:
    name: Build and test
    needs: check-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install QT
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          cache: true
      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DGMK_USE_TESTS=ON
      - name: Build project
        run: cmake --build build --parallel 2
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
  
  release:
    name: Create release
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect version change
        id: version
        shell: bash
        run: |
          CURRENT_VERSION="$(tr -d '[:space:]' < VERSION)"

          if ! [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([\-][a-zA-Z]+)?$ ]]; then
            echo "Invalid VERSION: $CURRENT_VERSION"
            exit 1
          fi

          PREVIOUS_VERSION="$(git show "${GITHUB_SHA}^:VERSION" 2>/dev/null || true)"
          PREVIOUS_VERSION="$(printf '%s' "$PREVIOUS_VERSION" | tr -d '[:space:]')"

          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Git tag
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes

      - name: Trigger release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ env.VERSION }}
        run: |
          gh workflow run release.yml \
            --ref main \
            -f tag="$TAG"
